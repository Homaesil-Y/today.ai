<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>오프라인 · 오늘의 AI</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f6f7f9; color: #171a21; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  .card { max-width: 360px; }
  .mark { width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 16px; background: linear-gradient(135deg, #6D5DFB, #17BFD3); }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #667085; line-height: 1.6; margin: 0 0 20px; }
  a { display: inline-block; padding: 11px 18px; border-radius: 10px; background: #6d5dfb; color: #fff; font-weight: 650; text-decoration: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark"></div>
    <h1>오프라인 상태입니다</h1>
    <p>인터넷 연결이 끊겨 있어요. 연결이 복구되면 오늘의 AI 트렌드를 다시 확인할 수 있습니다.</p>
    <a href="/">다시 시도</a>
  </div>
</body>
</html>
