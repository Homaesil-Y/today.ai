name: quality

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 예약 워크플로의 Supabase 제한 판정(.github/actions/supabase-status). 틀리면 제한 중에 실패 메일이
      # 다시 쏟아지거나, 정상인데 실행을 건너뛴다.
      - run: bash .github/actions/supabase-status/check.sh --self-test
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
