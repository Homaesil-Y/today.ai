name: AI news collection

on:
  schedule:
    # 글로벌 AI 뉴스 RSS를 수집해 한국어로 요약한다. 3시간 창마다 두 번 시도한다. (UTC)
    #
    # 예약 하나로는 GitHub 누락 탓에 하루 4회(기대 8회)만 실행돼 뉴스가 최대 8시간 묵었다.
    # 90분 어긋난 예약을 하나 더 둔다. 파이프라인(:23)·분석(:47/:17)과 분을 달리해 몰림을 피한다.
    #
    # 둘 다 도는 것은 낭비가 아니다 — 이미 저장된 링크는 건너뛰므로(news-runner 의 fresh 판정)
    # 새 기사가 없으면 요약 LLM 을 호출하지 않는다.
    - cron: "7 */3 * * *"
    - cron: "37 1-23/3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-news-collection
  cancel-in-progress: false

jobs:
  # Supabase 가 프로젝트를 제한(402) 중이면 본 작업을 건너뛴다(건너뛴 실행은 성공으로 끝나 실패 메일이 가지 않는다).
  # 2026-10-06 egress 한도 초과로 제한된 동안 모든 실행이 실패해 실패 메일이 하루 20통 가까이 쌓였다. 제한은
  # 결제 주기가 바뀌면 Supabase 가 스스로 풀고, 그 뒤 실행부터 자동으로 다시 돈다. 확인 요청은 1건(1KB 미만).
  supabase-status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      - id: check
        uses: ./.github/actions/supabase-status
        with:
          url: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          key: ${{ secrets.SUPABASE_SECRET_KEY }}

  collect-news:
    needs: supabase-status
    if: needs.supabase-status.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Supabase 전송량 계량 파일. 각 단계가 받은 응답 크기를 덧붙이고, 마지막 단계(egress:report)가 합쳐 기록한다.
      EGRESS_METER_FILE: ${{ github.workspace }}/.egress-meter.jsonl
      # Supabase 결제 주기 시작일(매월). 비어 있으면 23. 다르면 저장소 Settings → Variables 에 넣는다.
      SUPABASE_BILLING_CYCLE_DAY: ${{ vars.SUPABASE_BILLING_CYCLE_DAY }}
      APP_TIMEZONE: Asia/Seoul
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.1-flash-lite
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 글로벌 AI 뉴스 수집·한국어 요약
        run: pnpm news:collect
      # 이번 실행의 Supabase 전송량을 기록하고 결제 주기 한도를 점검한다(2026-10-06 egress 한도 초과로
      # 프로젝트가 차단된 뒤 추가). 앞 단계가 실패해도 기록은 남도록 항상 실행한다.
      - name: Supabase 전송량 기록·점검
        if: always()
        run: pnpm egress:report
