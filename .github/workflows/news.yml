name: AI news collection

on:
  schedule:
    # 글로벌 AI 뉴스 RSS를 수집해 한국어로 요약한다. 3시간 창마다 두 번 시도한다. (UTC)
    #
    # 예약 하나로는 GitHub 누락 탓에 하루 4회(기대 8회)만 실행돼 뉴스가 최대 8시간 묵었다.
    # 90분 어긋난 예약을 하나 더 둔다. 파이프라인(:23)·분석(:47/:17)과 분을 달리해 몰림을 피한다.
    #
    # 둘 다 도는 것은 낭비가 아니다 — 이미 저장된 링크는 건너뛰므로(news-runner 의 fresh 판정)
    # 새 기사가 없으면 요약 LLM 을 호출하지 않는다.
    - cron: "7 */3 * * *"
    - cron: "37 1-23/3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-news-collection
  cancel-in-progress: false

jobs:
  collect-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_TIMEZONE: Asia/Seoul
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.1-flash-lite
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 글로벌 AI 뉴스 수집·한국어 요약
        run: pnpm news:collect
