name: scheduled trend pipeline

on:
  schedule:
    # 수집·점수 계산은 3시간마다 수행합니다. (UTC)
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      run_ai:
        description: "Gemini 분석도 함께 실행"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: scheduled-trend-pipeline
  cancel-in-progress: false

jobs:
  collect-and-process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COLLECTOR_MODE: live
      APP_TIMEZONE: Asia/Seoul
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      GEMINI_MODEL: gemini-3.1-flash-lite
      GEMINI_ANALYSIS_LIMIT: "50"
      AUTO_APPROVE_ANALYZED: "true"
      # 표시명 정정에만 쓴다(대상이 없으면 호출 0회). 분석은 --skip-analysis로 계속 제외된다.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # 관리자가 /admin/settings에서 Groq를 고른 경우에만 실제로 쓰인다.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: GitHub·Hacker News·Product Hunt·Reddit 수집
        run: pnpm collect:live
      - name: 점수 계산 (AI 분석 제외)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && !inputs.run_ai }}
        run: pnpm process:live -- --skip-analysis
      - name: 점수 계산 및 Gemini 분석
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ai }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pnpm process:live
      # 이 워크플로도 AUTO_APPROVE_ANALYZED로 엔티티를 공개로 올릴 수 있으므로
      # 리포트를 만들기 전에 표시명을 정정한다(정정 대상이 없으면 Gemini 호출 0회).
      - name: 표시명 정정
        run: pnpm rename
      - name: 일간 리포트 생성·공개
        run: pnpm report:daily
      - name: 저장 결과 검증
        run: pnpm verify:live
