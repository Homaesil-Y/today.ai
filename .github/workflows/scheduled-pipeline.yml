name: scheduled trend pipeline

on:
  schedule:
    # 무료 실행 시간을 아끼기 위해 수집·점수 계산은 6시간마다 수행합니다. (UTC)
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      run_ai:
        description: "Gemini 분석도 함께 실행"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: scheduled-trend-pipeline
  cancel-in-progress: false

jobs:
  collect-and-process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COLLECTOR_MODE: live
      APP_TIMEZONE: Asia/Seoul
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
      GEMINI_MODEL: gemini-3.1-flash-lite
      GEMINI_ANALYSIS_LIMIT: "50"
      AUTO_APPROVE_ANALYZED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: GitHub·Hacker News·Product Hunt 수집
        run: pnpm collect:live
      - name: 점수 계산 (AI 분석 제외)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && !inputs.run_ai }}
        run: pnpm process:live -- --skip-analysis
      - name: 점수 계산 및 Gemini 분석
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ai }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pnpm process:live
      - name: 저장 결과 검증
        run: pnpm verify:live
