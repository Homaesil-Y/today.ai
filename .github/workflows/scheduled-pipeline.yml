name: scheduled trend pipeline

on:
  schedule:
    # 3시간 창마다 90분 어긋난 두 예약으로 시도한다. (UTC)
    #
    # GitHub 의 예약 실행은 보장이 아니라 최선 노력이다. 부하가 높으면 지연되거나 아예 누락된다.
    #
    # 매시간 예약(`23 * * * *`)은 실패한 실험이다. 2026-09-15 에 "자주 두드리면 덜 빠진다"는 가정으로
    # 바꿨는데 측정(9/16~10/04)은 정반대였다. 같은 기간 같은 저장소에서:
    #   매시간 1개(이 워크플로)   시도 24/일 → 실행 5.3/일 (전달률 22%), 최대 공백 8.6시간
    #   3시간 × 2개(분석·뉴스)    시도 16/일 → 실행 8.5~8.8/일 (전달률 53~55%)
    # 시도를 늘렸는데 실제 실행은 오히려 줄었다. GitHub 이 고빈도 예약을 더 공격적으로 버리는 것으로
    # 보인다(문서화된 동작은 아니다 — 원인은 가설, 수치는 사실). 예약 횟수로 신뢰성을 사는 방식은
    # 여기서 한계에 닿았고, 근본 해결은 GitHub 바깥의 트리거다(docs/handoff 의 외부 트리거 절 참고).
    #
    # 중복 채점은 process:live 가 막는다 — 최근 150분 안에 오늘자 채점이 있으면 즉시 종료한다.
    - cron: "17 */3 * * *"
    - cron: "47 1-23/3 * * *"
  workflow_dispatch:
    inputs:
      run_ai:
        description: "Gemini 분석도 함께 실행"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: scheduled-trend-pipeline
  cancel-in-progress: false

jobs:
  # Supabase 가 프로젝트를 제한(402) 중이면 본 작업을 건너뛴다(건너뛴 실행은 성공으로 끝나 실패 메일이 가지 않는다).
  # 2026-10-06 egress 한도 초과로 제한된 동안 모든 실행이 실패해 실패 메일이 하루 20통 가까이 쌓였다. 제한은
  # 결제 주기가 바뀌면 Supabase 가 스스로 풀고, 그 뒤 실행부터 자동으로 다시 돈다. 확인 요청은 1건(1KB 미만).
  supabase-status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      - id: check
        uses: ./.github/actions/supabase-status
        with:
          url: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          key: ${{ secrets.SUPABASE_SECRET_KEY }}

  collect-and-process:
    needs: supabase-status
    if: needs.supabase-status.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Supabase 전송량 계량 파일. 각 단계가 받은 응답 크기를 덧붙이고, 마지막 단계(egress:report)가 합쳐 기록한다.
      EGRESS_METER_FILE: ${{ github.workspace }}/.egress-meter.jsonl
      # Supabase 결제 주기 시작일(매월). 비어 있으면 23. 다르면 저장소 Settings → Variables 에 넣는다.
      SUPABASE_BILLING_CYCLE_DAY: ${{ vars.SUPABASE_BILLING_CYCLE_DAY }}
      # 전송량이 위험 단계면 마지막 단계를 실패시켜 실패 메일로 알린다(다른 워크플로는 기록만 해서 메일이 몰리지 않게).
      EGRESS_FAIL_ON_ALERT: "true"
      COLLECTOR_MODE: live
      APP_TIMEZONE: Asia/Seoul
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      GEMINI_MODEL: gemini-3.1-flash-lite
      GEMINI_ANALYSIS_LIMIT: "50"
      # 이 잡은 같은 15분 안에서 수집까지 하므로 분석 예산을 hourly-analysis보다 짧게 잡는다.
      # 분석이 오래 걸려도 자동 승인·표시명 정정·리포트·검증 단계가 실행되도록 보장한다.
      ANALYSIS_BUDGET_MINUTES: "6"
      AUTO_APPROVE_ANALYZED: "true"
      # 표시명 정정에만 쓴다(대상이 없으면 호출 0회). 분석은 --skip-analysis로 계속 제외된다.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # 관리자가 /admin/settings에서 Groq를 고른 경우에만 실제로 쓰인다.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: GitHub·Hacker News·Product Hunt·Reddit 수집
        run: pnpm collect:live
      - name: 점수 계산 (AI 분석 제외)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && !inputs.run_ai }}
        run: pnpm process:live -- --skip-analysis
      - name: 점수 계산 및 Gemini 분석
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ai }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pnpm process:live
      # 이 워크플로도 AUTO_APPROVE_ANALYZED로 엔티티를 공개로 올릴 수 있으므로
      # 리포트를 만들기 전에 표시명을 정정한다(정정 대상이 없으면 Gemini 호출 0회).
      - name: 표시명 정정
        run: pnpm rename
      - name: 일간 리포트 생성·공개
        run: pnpm report:daily
      - name: 저장 결과 검증
        run: pnpm verify:live
      # 이번 실행의 Supabase 전송량을 기록하고 결제 주기 한도를 점검한다(2026-10-06 egress 한도 초과로
      # 프로젝트가 차단된 뒤 추가). 앞 단계가 실패해도 기록은 남도록 항상 실행한다.
      - name: Supabase 전송량 기록·점검
        if: always()
        run: pnpm egress:report
