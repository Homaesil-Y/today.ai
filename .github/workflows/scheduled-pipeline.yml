name: scheduled trend pipeline

on:
  schedule:
    # 매시간 시도하고, 실제 채점 간격은 코드가 정한다. (UTC)
    #
    # GitHub 의 예약 실행은 보장이 아니라 최선 노력이다. 부하가 높으면 지연되거나 아예 누락된다.
    # 3시간 간격 예약 하나였을 때는 하루 2~5회만 실행됐고(2026-08-27~28 각 2회), 90분 어긋난 예약을
    # 하나 더 두자 하루 8.6회로 올랐지만 여전히 부족했다 — 실측(9/12~9/15, 32회 실행): 31개 구간 중
    # 12개가 3시간을 넘겼고 8개는 4시간, 최대 5.8시간 공백이었다.
    #
    # 그래서 "예약을 정확한 시각에 맞추는" 접근을 포기하고 "자주 두드리고 코드가 조절하는" 쪽으로
    # 바꾼다. 매시간이면 3시간 창 안에 세 번의 기회가 생겨, 한 창이 통째로 비려면 세 번 연속
    # 누락돼야 한다. 저장소가 public 이라 Actions 분은 무제한이고, 채점을 건너뛰는 실행은 51~72초로
    # 끝난다(정상 실행은 290~405초).
    #
    # 중복 채점은 process:live 가 막는다 — 최근 150분 안에 오늘자 채점이 있으면 즉시 종료한다.
    # 수집 단계는 매번 돈다. 이건 부작용이 아니라 이득이다: collected_at 이 자주 갱신돼 신선도 감쇠
    # (initial-score.ts 의 recencyDecay)가 실제 화제성을 더 잘 따라간다.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      run_ai:
        description: "Gemini 분석도 함께 실행"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: scheduled-trend-pipeline
  cancel-in-progress: false

jobs:
  collect-and-process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COLLECTOR_MODE: live
      APP_TIMEZONE: Asia/Seoul
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      GEMINI_MODEL: gemini-3.1-flash-lite
      GEMINI_ANALYSIS_LIMIT: "50"
      # 이 잡은 같은 15분 안에서 수집까지 하므로 분석 예산을 hourly-analysis보다 짧게 잡는다.
      # 분석이 오래 걸려도 자동 승인·표시명 정정·리포트·검증 단계가 실행되도록 보장한다.
      ANALYSIS_BUDGET_MINUTES: "6"
      AUTO_APPROVE_ANALYZED: "true"
      # 표시명 정정에만 쓴다(대상이 없으면 호출 0회). 분석은 --skip-analysis로 계속 제외된다.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # 관리자가 /admin/settings에서 Groq를 고른 경우에만 실제로 쓰인다.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: GitHub·Hacker News·Product Hunt·Reddit 수집
        run: pnpm collect:live
      - name: 점수 계산 (AI 분석 제외)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && !inputs.run_ai }}
        run: pnpm process:live -- --skip-analysis
      - name: 점수 계산 및 Gemini 분석
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ai }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pnpm process:live
      # 이 워크플로도 AUTO_APPROVE_ANALYZED로 엔티티를 공개로 올릴 수 있으므로
      # 리포트를 만들기 전에 표시명을 정정한다(정정 대상이 없으면 Gemini 호출 0회).
      - name: 표시명 정정
        run: pnpm rename
      - name: 일간 리포트 생성·공개
        run: pnpm report:daily
      - name: 저장 결과 검증
        run: pnpm verify:live
