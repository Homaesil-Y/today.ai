name: periodic Gemini analysis retry

on:
  schedule:
    # 남은 미분석·재분석 후보를 처리한다. 90분 어긋난 두 예약으로 3시간 창마다 두 번 시도한다. (UTC)
    #
    # 예약을 하나만 두면 GitHub 의 누락 때문에 실제 실행이 하루 5회 안팎으로 떨어진다. 실행당 상한이
    # 50건이라 5회는 250건/일이고, 재분석 주기 120시간·공개 엔티티 1,174건 기준 필요량 235건/일과
    # 거의 붙어 백로그가 쌓인다(2026-09-15 실측 커버리지 43%까지 떨어졌다). 두 예약이면 하루 9회
    # 안팎이 실제로 돌아 450건/일 능력이 확보된다.
    #
    # 둘 다 도는 날에도 과소비되지 않는다. 대기열(selectPendingAnalyses)은 미분석과 재분석 주기가
    # 지난 것만 고르므로, 커버리지가 올라가면 뽑을 대상이 저절로 줄어든다.
    #
    # 예전 주석에 "private 저장소의 무료 분을 아끼려 3시간 주기"라고 적혀 있었으나 이 저장소는
    # public 이라 Actions 분은 무제한이다. 빈도를 묶을 이유는 분 단가가 아니라 Gemini 무료 한도다.
    - cron: "47 */3 * * *"
    - cron: "17 1-23/3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-trend-pipeline
  cancel-in-progress: false

jobs:
  # Supabase 가 프로젝트를 제한(402) 중이면 본 작업을 건너뛴다(건너뛴 실행은 성공으로 끝나 실패 메일이 가지 않는다).
  # 2026-10-06 egress 한도 초과로 제한된 동안 모든 실행이 실패해 실패 메일이 하루 20통 가까이 쌓였다. 제한은
  # 결제 주기가 바뀌면 Supabase 가 스스로 풀고, 그 뒤 실행부터 자동으로 다시 돈다. 확인 요청은 1건(1KB 미만).
  supabase-status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      - id: check
        uses: ./.github/actions/supabase-status
        with:
          url: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          key: ${{ secrets.SUPABASE_SECRET_KEY }}

  analyze-pending:
    needs: supabase-status
    if: needs.supabase-status.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Supabase 전송량 계량 파일. 각 단계가 받은 응답 크기를 덧붙이고, 마지막 단계(egress:report)가 합쳐 기록한다.
      EGRESS_METER_FILE: ${{ github.workspace }}/.egress-meter.jsonl
      # Supabase 결제 주기 시작일(매월). 비어 있으면 23. 다르면 저장소 Settings → Variables 에 넣는다.
      SUPABASE_BILLING_CYCLE_DAY: ${{ vars.SUPABASE_BILLING_CYCLE_DAY }}
      APP_TIMEZONE: Asia/Seoul
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.1-flash-lite
      # 관리자가 /admin/settings에서 Groq를 고르면 이 키로 넘어간다. 안 골랐으면 안 쓰인다.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_ANALYSIS_LIMIT: "50"
      # 아래 timeout-minutes보다 짧게 잡아, 분석이 느려도 자동 승인·표시명 정정·검증이 실행되게 한다.
      # 이 값이 없던 시절 Groq 전환 후 분석만 하다 타임아웃에 걸려, 저장된 분석 22건이 공개되지 못했다.
      # 11분인 이유: 예산은 프로세스 시작 기준인데 분석 전의 엔티티 순차 upsert 단계가 5~10분으로
      # 요동친다(실측 2026-08-07: 9분 예산에서 upsert가 10분을 먹어 분석 0건 실행 발생).
      ANALYSIS_BUDGET_MINUTES: "11"
      AUTO_APPROVE_ANALYZED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --analysis-only: 엔티티·점수 재기록(후보당 3~4회 DB 왕복, 5~10분)을 건너뛰고 분석에 집중한다.
      # 그 기록은 scheduled-pipeline 이 같은 3시간 주기(30분 앞서)로 이미 하고 있다.
      - name: 남은 후보 Gemini 분석 및 자동 승인
        run: pnpm process:live -- --analysis-only
      # 게시글 제목이 문장이라 표시명이 제품명으로 잘리지 않은 신규 엔티티만 정정한다.
      # 대상이 없으면 Gemini를 호출하지 않고 즉시 끝나므로 매 실행에 붙여도 비용이 없다.
      - name: 표시명 정정
        run: pnpm rename
      - name: 저장 결과 검증
        run: pnpm verify:live
      # 이번 실행의 Supabase 전송량을 기록하고 결제 주기 한도를 점검한다(2026-10-06 egress 한도 초과로
      # 프로젝트가 차단된 뒤 추가). 앞 단계가 실패해도 기록은 남도록 항상 실행한다.
      - name: Supabase 전송량 기록·점검
        if: always()
        run: pnpm egress:report
