name: periodic Gemini analysis retry

on:
  schedule:
    # 남은 미분석 후보를 3시간마다 다시 시도합니다. (UTC)
    # private 저장소의 무료 GitHub Actions 분을 아끼기 위해 매시간 대신 3시간 주기로 실행합니다.
    # 실행당 최대 50건(Gemini 무료 한도 도달 시 중단)을 처리하므로 하루 8회로도 대기열을 충분히 소진합니다.
    - cron: "47 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-trend-pipeline
  cancel-in-progress: false

jobs:
  analyze-pending:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_TIMEZONE: Asia/Seoul
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.1-flash-lite
      GEMINI_ANALYSIS_LIMIT: "50"
      AUTO_APPROVE_ANALYZED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 남은 후보 Gemini 분석 및 자동 승인
        run: pnpm process:live
      # 게시글 제목이 문장이라 표시명이 제품명으로 잘리지 않은 신규 엔티티만 정정한다.
      # 대상이 없으면 Gemini를 호출하지 않고 즉시 끝나므로 매 실행에 붙여도 비용이 없다.
      - name: 표시명 정정
        run: pnpm rename
      - name: 저장 결과 검증
        run: pnpm verify:live
