name: periodic Gemini analysis retry

on:
  schedule:
    # 남은 미분석 후보를 3시간마다 다시 시도합니다. (UTC)
    # private 저장소의 무료 GitHub Actions 분을 아끼기 위해 매시간 대신 3시간 주기로 실행합니다.
    # 실행당 최대 50건(Gemini 무료 한도 도달 시 중단)을 처리하므로 하루 8회로도 대기열을 충분히 소진합니다.
    - cron: "47 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-trend-pipeline
  cancel-in-progress: false

jobs:
  analyze-pending:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_TIMEZONE: Asia/Seoul
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.1-flash-lite
      # 관리자가 /admin/settings에서 Groq를 고르면 이 키로 넘어간다. 안 골랐으면 안 쓰인다.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_ANALYSIS_LIMIT: "50"
      # 아래 timeout-minutes보다 짧게 잡아, 분석이 느려도 자동 승인·표시명 정정·검증이 실행되게 한다.
      # 이 값이 없던 시절 Groq 전환 후 분석만 하다 타임아웃에 걸려, 저장된 분석 22건이 공개되지 못했다.
      # 11분인 이유: 예산은 프로세스 시작 기준인데 분석 전의 엔티티 순차 upsert 단계가 5~10분으로
      # 요동친다(실측 2026-08-07: 9분 예산에서 upsert가 10분을 먹어 분석 0건 실행 발생).
      ANALYSIS_BUDGET_MINUTES: "11"
      AUTO_APPROVE_ANALYZED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --analysis-only: 엔티티·점수 재기록(후보당 3~4회 DB 왕복, 5~10분)을 건너뛰고 분석에 집중한다.
      # 그 기록은 scheduled-pipeline 이 같은 3시간 주기(30분 앞서)로 이미 하고 있다.
      - name: 남은 후보 Gemini 분석 및 자동 승인
        run: pnpm process:live -- --analysis-only
      # 게시글 제목이 문장이라 표시명이 제품명으로 잘리지 않은 신규 엔티티만 정정한다.
      # 대상이 없으면 Gemini를 호출하지 않고 즉시 끝나므로 매 실행에 붙여도 비용이 없다.
      - name: 표시명 정정
        run: pnpm rename
      - name: 저장 결과 검증
        run: pnpm verify:live
