name: daily report email

on:
  schedule:
    # 매일 한국 시간 08:00(UTC 23:00)에 일간 리포트를 갱신하고 구독자에게 발송합니다.
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-trend-pipeline
  cancel-in-progress: false

jobs:
  # Supabase 가 프로젝트를 제한(402) 중이면 본 작업을 건너뛴다(건너뛴 실행은 성공으로 끝나 실패 메일이 가지 않는다).
  # 2026-10-06 egress 한도 초과로 제한된 동안 모든 실행이 실패해 실패 메일이 하루 20통 가까이 쌓였다. 제한은
  # 결제 주기가 바뀌면 Supabase 가 스스로 풀고, 그 뒤 실행부터 자동으로 다시 돈다. 확인 요청은 1건(1KB 미만).
  supabase-status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      - id: check
        uses: ./.github/actions/supabase-status
        with:
          url: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          key: ${{ secrets.SUPABASE_SECRET_KEY }}

  send-daily-report:
    needs: supabase-status
    if: needs.supabase-status.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Supabase 전송량 계량 파일. 각 단계가 받은 응답 크기를 덧붙이고, 마지막 단계(egress:report)가 합쳐 기록한다.
      EGRESS_METER_FILE: ${{ github.workspace }}/.egress-meter.jsonl
      # Supabase 결제 주기 시작일(매월). 비어 있으면 23. 다르면 저장소 Settings → Variables 에 넣는다.
      SUPABASE_BILLING_CYCLE_DAY: ${{ vars.SUPABASE_BILLING_CYCLE_DAY }}
      APP_TIMEZONE: Asia/Seoul
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 일간 리포트 갱신
        run: pnpm report:daily
      - name: 신규 카테고리 후보 제안 (하루 1회, Gemini 배치 1콜)
        run: pnpm suggest:categories
        continue-on-error: true
      - name: 구독자 이메일 발송 (자격증명 없으면 blocked)
        run: pnpm report:send
      # 이번 실행의 Supabase 전송량을 기록하고 결제 주기 한도를 점검한다(2026-10-06 egress 한도 초과로
      # 프로젝트가 차단된 뒤 추가). 앞 단계가 실패해도 기록은 남도록 항상 실행한다.
      - name: Supabase 전송량 기록·점검
        if: always()
        run: pnpm egress:report
